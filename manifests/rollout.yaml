apiVersion: argoproj.io/v1alpha1
kind: Rollout
metadata:
  name: go-simple-webserver
  labels:
    app: go-simple-webserver
spec:
  replicas: 10
  strategy:
    canary:
      steps:
        # Pasul 1: 25% din trafic către versiunea nouă
        - setWeight: 25
        - pause: { duration: 120s }
        # Pasul 2: 75% din trafic către versiunea nouă
        - setWeight: 75
        - pause: { duration: 120s }
        # Pasul 3: 100% din trafic către versiunea nouă
        - setWeight: 100
  selector:
    matchLabels:
      app: go-simple-webserver
  template:
    metadata:
      labels:
        app: go-simple-webserver
    spec:
      containers:
        - name: webserver
          # Asigură-te că folosești username-ul tău corect și tag-ul :latest
          image: ghcr.io/andreimitea30/ci_cd_lab:latest
          ports:
            - containerPort: 8080
          imagePullPolicy: Always
